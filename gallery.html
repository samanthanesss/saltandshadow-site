<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — Salt & Shadow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="site-body">
  <div class="texture"></div>
  <main class="page-shell page-shell--inner">
    <nav class="page-top" aria-label="Primary">
      <a class="back-link" href="index.html">Back</a>
      <div class="site-nav site-nav--compact">
        <a class="site-nav__link" href="index.html">Home</a>
        <a class="site-nav__link" href="about.html">About</a>
        <a class="site-nav__link" href="culinary.html">Culinary</a>
        <a class="site-nav__link" href="photography.html">Photography</a>
        <a class="site-nav__link site-nav__link--active" href="gallery.html">Gallery</a>
        <a class="site-nav__link" href="blog-photography.html">Photography Blog</a>
        <a class="site-nav__link" href="blog-culinary.html">Culinary Blog</a>
        <a class="site-nav__link" href="contact.html">Contact</a>
      </div>
    </nav>

    <section class="inner-hero inner-hero--left">
      <h1 class="page-title">Gallery</h1>
      <p class="intro-note">A curated collection of recent work across photography.</p>
    </section>

    <!-- Filter Bar -->
    <section class="filter-bar">
      <div class="filter-buttons">
        <button class="filter-button filter-button--active" data-filter="all">All</button>
        <button class="filter-button" data-filter="places">Places</button>
        <button class="filter-button" data-filter="nature">Nature</button>
        <button class="filter-button" data-filter="wildlife">Wildlife</button>
        <button class="filter-button" data-filter="people">People</button>
        <button class="filter-button" data-filter="food">Food</button>
        <button class="filter-button" data-filter="art">Art</button>
        <button class="filter-button" data-filter="details">Details</button>
      </div>
    </section>

    <!-- Gallery Grid -->
    <section class="gallery-grid" aria-label="Photography gallery">
      <!-- Urban -->
      <article class="gallery-item" data-category="places">
        <img src="gallery-places-1.jpg" alt="Urban photography" />
      </article>
      <article class="gallery-item" data-category="places">
        <img src="gallery-places-2.jpg" alt="Urban photography" />
      </article>
      <article class="gallery-item" data-category="places">
        <img src="gallery-places-3.jpg" alt="Urban photography" />
      </article>

      <!-- Landscape -->
      <article class="gallery-item" data-category="nature">
        <img src="gallery-nature-1.jpg" alt="Landscape photography" />
      </article>
      <article class="gallery-item" data-category="nature">
        <img src="gallery-nature-2.jpg" alt="Landscape photography" />
      </article>
      <article class="gallery-item" data-category="nature">
        <img src="gallery-nature-3.jpg" alt="Landscape photography" />
      </article>

      <!-- Wildlife -->
      <article class="gallery-item" data-category="wildlife">
        <img src="gallery-wildlife-1.jpg" alt="Wildlife photography" />
      </article>
      <article class="gallery-item" data-category="wildlife">
        <img src="gallery-wildlife-2.jpg" alt="Wildlife photography" />
      </article>
      <article class="gallery-item" data-category="wildlife">
        <img src="gallery-wildlife-3.jpg" alt="Wildlife photography" />
      </article>

      <!-- People -->
      <article class="gallery-item" data-category="people">
        <img src="gallery-people-1.jpg" alt="Portrait photography" />
      </article>
      <article class="gallery-item" data-category="people">
        <img src="gallery-people-2.jpg" alt="Portrait photography" />
      </article>
      <article class="gallery-item" data-category="people">
        <img src="gallery-people-3.jpg" alt="Portrait photography" />
      </article>

      <!-- Food -->
      <article class="gallery-item" data-category="food">
        <img src="gallery-food-1.jpg" alt="Food photography" />
      </article>
      <article class="gallery-item" data-category="food">
        <img src="gallery-food-2.jpg" alt="Food photography" />
      </article>
      <article class="gallery-item" data-category="food">
        <img src="gallery-food-3.jpg" alt="Food photography" />
      </article>

      <!-- Art -->
      <article class="gallery-item" data-category="art">
        <img src="gallery-art-1.jpg" alt="Art photography" />
      </article>
      <article class="gallery-item" data-category="art">
        <img src="gallery-art-2.jpg" alt="Art photography" />
      </article>
      <article class="gallery-item" data-category="art">
        <img src="gallery-art-3.jpg" alt="Art photography" />
      </article>

      <!-- Details -->
      <article class="gallery-item" data-category="details">
        <img src="gallery-details-1.jpg" alt="Detail photography" />
      </article>
      <article class="gallery-item" data-category="details">
        <img src="gallery-details-2.jpg" alt="Detail photography" />
      </article>
      <article class="gallery-item" data-category="details">
        <img src="gallery-details-3.jpg" alt="Detail photography" />
      </article>
    </section>
  </main>

  <script>
    document.querySelectorAll('.filter-button').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.filter-button').forEach(b => b.classList.remove('filter-button--active'));
        button.classList.add('filter-button--active');

        const filter = button.dataset.filter;
        document.querySelectorAll('.gallery-item').forEach(item => {
          if (filter === 'all' || item.dataset.category === filter) {
            item.classList.remove('hidden');
          } else {
            item.classList.add('hidden');
          }
        });
      });
    });
  </script>
</body>
</html>
