<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photography Blog — Salt & Shadow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="site-body">
  <div class="texture"></div>
  <main class="page-shell page-shell--inner">
    <nav class="page-top" aria-label="Primary">
      <a class="back-link" href="index.html">Back</a>
      <div class="site-nav site-nav--compact">
        <a class="site-nav__link" href="index.html">Home</a>
        <a class="site-nav__link" href="about.html">About</a>
        <a class="site-nav__link" href="culinary.html">Culinary</a>
        <a class="site-nav__link" href="photography.html">Photography</a>
        <a class="site-nav__link" href="gallery.html">Gallery</a>
        <a class="site-nav__link site-nav__link--active" href="blog-photography.html">Photography Blog</a>
        <a class="site-nav__link" href="blog-culinary.html">Culinary Blog</a>
        <a class="site-nav__link" href="contact.html">Contact</a>
      </div>
    </nav>

    <section class="inner-hero inner-hero--left">
      <h1 class="page-title">Photography Blog</h1>
      <p class="intro-note">Insights into light, composition, and the craft of photography.</p>
    </section>

    <!-- Filter Bar -->
    <section class="filter-bar">
      <div class="filter-buttons">
        <button class="filter-button filter-button--active" data-filter="all">All</button>
        <button class="filter-button" data-filter="technique">Technique</button>
        <button class="filter-button" data-filter="process">Process</button>
        <button class="filter-button" data-filter="light">Light</button>
        <button class="filter-button" data-filter="composition">Composition</button>
      </div>
    </section>

    <!-- Blog Grid -->
    <section class="blog-grid" aria-label="Photography blog posts">
      <article class="blog-card" data-category="technique">
        <a href="blog-photography-post-1.html" class="blog-card__image-link">
          <img src="blog-photography-featured-1.jpg" alt="Golden Hour: Capturing Light and Mood in Urban Portraits" class="blog-card__image" />
        </a>
      </article>

      <!-- Placeholder cards for future content -->
      <article class="blog-card" data-category="process">
        <a href="#" class="blog-card__image-link">
          <img src="blog-photography-featured-2.jpg" alt="Coming Soon: Photography process" class="blog-card__image" />
        </a>
      </article>

      <article class="blog-card" data-category="light">
        <a href="#" class="blog-card__image-link">
          <img src="blog-photography-featured-3.jpg" alt="Coming Soon: Light study" class="blog-card__image" />
        </a>
      </article>
    </section>
  </main>

  <script>
    document.querySelectorAll('.filter-button').forEach(button => {
      button.addEventListener('click', () => {
        // Update active state
        document.querySelectorAll('.filter-button').forEach(b => b.classList.remove('filter-button--active'));
        button.classList.add('filter-button--active');

        // Filter items
        const filter = button.dataset.filter;
        document.querySelectorAll('.blog-card').forEach(item => {
          if (filter === 'all' || item.dataset.category === filter) {
            item.classList.remove('hidden');
          } else {
            item.classList.add('hidden');
          }
        });
      });
    });
  </script>
</body>
</html>
