<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Culinary Blog — Salt & Shadow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="site-body">
  <div class="texture"></div>
  <main class="page-shell page-shell--inner">
    <nav class="page-top" aria-label="Primary">
      <a class="back-link" href="index.html">Back</a>
      <div class="site-nav site-nav--compact">
        <a class="site-nav__link" href="index.html">Home</a>
        <a class="site-nav__link" href="about.html">About</a>
        <a class="site-nav__link" href="culinary.html">Culinary</a>
        <a class="site-nav__link" href="gallery.html">Photography</a>
        <a class="site-nav__link site-nav__link--active" href="blog-culinary.html">Culinary Blog</a>
        <a class="site-nav__link" href="contact.html">Contact</a>
      </div>
    </nav>

    <section class="inner-hero inner-hero--left">
      <h1 class="page-title">Culinary Journal</h1>
      <p class="intro-note">A working journal from culinary school and beyond, focused on technique, recipes, and the process of learning to cook with intention.</p>
    </section>

    <!-- Filter Bar -->
    <section class="filter-bar">
      <div class="filter-buttons">
        <button class="filter-button filter-button--active" data-filter="all">All</button>
        <button class="filter-button" data-filter="school">School</button>
        <button class="filter-button" data-filter="technique">Technique</button>
        <button class="filter-button" data-filter="recipe">Recipe</button>
        <button class="filter-button" data-filter="experience">Experience</button>
      </div>
    </section>

    <!-- Blog Grid -->
    <section class="blog-grid" aria-label="Culinary blog posts">
      <article class="blog-card" data-category="school">
        <a href="blog-culinary-post-1.html" class="blog-card__image-link">
          <img src="culinary-01-blog-card.png" alt="Before the Knife" class="blog-card__image" />
        </a>
      </article>

      <article class="blog-card" data-category="school">
        <a href="blog-culinary-post-2.html" class="blog-card__image-link">
          <img src="culinary-02-blog-card.png" alt="Learning to Work" class="blog-card__image" />
        </a>
      </article>

      <article class="blog-card" data-category="recipe">
        <a href="blog-culinary-post-2a.html" class="blog-card__image-link">
          <img src="culinary-02a-blog-card.png" alt="Chocolate Chunk Cookies" class="blog-card__image" />
        </a>
      </article>

      <article class="blog-card" data-category="recipe">
        <a href="blog-culinary-post-2b.html" class="blog-card__image-link">
          <img src="culinary-02b-blog-card.png" alt="Potato and Leek Galette" class="blog-card__image" />
        </a>
      </article>

      <article class="blog-card" data-category="recipe">
        <a href="blog-culinary-post-2c.html" class="blog-card__image-link">
          <img src="culinary-02c-blog-card.png" alt="Pâte Brisée" class="blog-card__image" />
        </a>
      </article>

      <article class="blog-card" data-category="recipe">
        <a href="blog-culinary-post-2d.html" class="blog-card__image-link">
          <img src="culinary-02d-blog-card.png" alt="Shanghai Pan-Fried Noodles" class="blog-card__image" />
        </a>
      </article>

      <article class="blog-card" data-category="recipe">
        <a href="blog-culinary-post-2e.html" class="blog-card__image-link">
          <img src="culinary-02e-blog-card.png" alt="French Vegetable Stock" class="blog-card__image" />
        </a>
      </article>
    </section>
  </main>

  <script>
    document.querySelectorAll('.filter-button').forEach(button => {
      button.addEventListener('click', () => {
        // Update active state
        document.querySelectorAll('.filter-button').forEach(b => b.classList.remove('filter-button--active'));
        button.classList.add('filter-button--active');

        // Filter items
        const filter = button.dataset.filter;
        document.querySelectorAll('.blog-card').forEach(item => {
          if (filter === 'all' || item.dataset.category === filter) {
            item.classList.remove('hidden');
          } else {
            item.classList.add('hidden');
          }
        });
      });
    });
  </script>
</body>
</html>
