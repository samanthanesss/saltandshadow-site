<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salt & Shadow</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #f5f3f0;
      color: #2f2f2f;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 80px 20px;
      text-align: center;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 56px;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .tagline {
      font-size: 18px;
      color: #6f6f6f;
      margin-bottom: 60px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
    }

    .card {
      background: #ffffff;
      text-decoration: none;
      color: inherit;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .card img {
      width: 100%;
      height: 460px;
      object-fit: cover;
      object-position: center 35%;
      display: block;
    }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      margin: 20px 0 5px;
    }

    .card-sub {
      font-size: 14px;
      color: #7a7a7a;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 42px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Salt & Shadow</h1>
    <div class="tagline">Food, image, and atmosphere.</div>

    <div class="grid">

      <!-- Photography -->
      <a href="#" class="card">
        <img src="crow.jpg" alt="Crow on stone urn" />
        <div class="card-title">Photography</div>
        <div class="card-sub">Soul & Horizon</div>
      </a>

      <!-- Culinary -->
      <a href="#" class="card">
        <img src="charcuterie.jpg" alt="Charcuterie board" />
        <div class="card-title">Culinary</div>
      </a>

    </div>
  </div>
</body>
</html>
