<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Salt & Shadow</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f5f3f0;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --card-radius: 14px;
      --shadow: 0 10px 30px rgba(0,0,0,0.06);
      --shadow-hover: 0 16px 40px rgba(0,0,0,0.10);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 100px 24px 80px;
    }

    header {
      text-align: center;
      margin-bottom: 64px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.5rem, 4vw, 3.2rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    .tagline {
      font-size: 0.95rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
    }

    .card {
      position: relative;
      overflow: hidden;
      border-radius: var(--card-radius);
      box-shadow: var(--shadow);
      transition: transform 0.35s ease, box-shadow 0.35s ease;
      text-decoration: none;
      color: inherit;
      background: #000;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-hover);
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: brightness(0.88) contrast(1.05);
      transition: transform 0.6s ease, filter 0.4s ease;
    }

    .card:hover img {
      transform: scale(1.03);
      filter: brightness(0.95) contrast(1.08);
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(0,0,0,0.45) 10%,
        rgba(0,0,0,0.15) 50%,
        rgba(0,0,0,0.05) 100%
      );
    }

    .card-content {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 2;
    }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 500;
      color: #fff;
      letter-spacing: -0.01em;
    }

    @media (max-width: 768px) {
      .container {
        padding: 80px 20px 60px;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .card {
        height: 340px;
      }
    }

    @media (min-width: 769px) {
      .card {
        height: 420px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Salt & Shadow</h1>
      <div class="tagline">Food, image, and atmosphere.</div>
    </header>

    <div class="grid">
      <a href="#" class="card">
        <img src="crow.jpg" alt="Photography">
        <div class="card-content">
          <div class="card-title">Photography</div>
        </div>
      </a>

      <a href="#" class="card">
        <img src="charcuterie.jpg" alt="Culinary">
        <div class="card-content">
          <div class="card-title">Culinary</div>
        </div>
      </a>
    </div>
  </div>

</body>
</html>
