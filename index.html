<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Salt & Shadow</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #f5f3f0;
      color: #2f2f2f;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 80px 20px;
      text-align: center;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 48px;
      margin-bottom: 10px;
    }

    .tagline {
      color: #777;
      font-size: 16px;
      margin-bottom: 25px;
    }

    .nav {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin-bottom: 60px;
      font-family: 'Playfair Display', serif;
      font-size: 16px;
    }

    .nav a {
      text-decoration: none;
      color: #444;
    }

    .nav a:hover {
      opacity: 0.6;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
    }

    .card {
      text-decoration: none;
      color: inherit;
      background: white;
    }

    .image-wrap {
      width: 100%;
      aspect-ratio: 4 / 5;
      overflow: hidden;
    }

    .image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-content {
      padding: 24px;
    }

    .card h2 {
      font-family: 'Playfair Display', serif;
      margin: 0;
      font-size: 26px;
    }

    .sub {
      font-size: 14px;
      color: #888;
      margin-top: 6px;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 36px;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>Salt & Shadow</h1>
    <div class="tagline">Food, image, and atmosphere.</div>

    <div class="nav">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="culinary.html">Culinary</a>
      <a href="#">Photography</a>
    </div>

    <div class="grid">

      <a href="#" class="card">
        <div class="image-wrap">
          <img src="crow.jpg" alt="Photography" />
        </div>
        <div class="card-content">
          <h2>Photography</h2>
          <div class="sub">Soul & Horizon</div>
        </div>
      </a>

      <a href="culinary.html" class="card">
        <div class="image-wrap">
          <img src="charcuterie.jpg" alt="Culinary" />
        </div>
        <div class="card-content">
          <h2>Culinary</h2>
        </div>
      </a>

    </div>

  </div>
</body>
</html>
