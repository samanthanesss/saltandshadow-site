<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salt & Shadow</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #e9e6e1;
      color: #2e2e2e;
      text-align: center;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 500;
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .tagline {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      opacity: 0.7;
      margin-bottom: 60px;
    }

    .grid {
      display: flex;
      gap: 30px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 80px;
    }

    .card {
      width: 320px;
      background: #f4f2ee;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    .card img {
      width: 100%;
      display: block;
    }

    .card-content {
      padding: 20px;
    }

    .card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      margin: 0;
    }

    .card p {
      font-size: 0.9rem;
      opacity: 0.6;
      margin-top: 5px;
    }

    .about {
      letter-spacing: 0.2em;
      font-size: 0.75rem;
      margin-bottom: 40px;
      opacity: 0.6;
    }

    .footer {
      font-size: 0.9rem;
      line-height: 1.6;
      opacity: 0.75;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    @media (max-width: 768px) {
      .grid {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>Salt & Shadow</h1>
    <div class="tagline">Food, image, and atmosphere.</div>

    <div class="grid">
      <div class="card">
        <img src="https://images.unsplash.com/photo-1608198093002-ad4e005484ec" alt="bread">
        <div class="card-content">
          <h2>Photography</h2>
          <p>Soul & Horizon</p>
        </div>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1544025162-d76694265947" alt="culinary">
        <div class="card-content">
          <h2>Culinary</h2>
        </div>
      </div>
    </div>

    <div class="about">ABOUT</div>

    <div class="footer">
      Samantha Piehoff<br>
      <a href="mailto:samantha@saltandshadowco.com">samantha@saltandshadowco.com</a><br>
      saltandshadowco.com
    </div>

  </div>
</body>
</html>
